<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fitness Project</title>
<meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0d1012">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fitness Project">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" href="icon-192.png">
<style>html,body{margin:0;height:100%;background:#0d1012;color:#848b96;font:14px -apple-system,system-ui,sans-serif}#l{height:100%;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}</style>
</head><body><div id="l">Loading…</div>
<script>
// Fitness Project shell: the dashboard itself is fetched from your Apps Script, so design updates arrive automatically.
// Your private key is never stored in this file: it comes from your link (#k=…) and stays on this device.
(function(){
  var API='https://script.google.com/macros/s/AKfycbwsI17C-qoeKqbZiZ4N0mHrzCeq0aVYer01esJCG-qjd6PFa_DUYNRrI_a5ITD_oVa8_w/exec';
  var el=document.getElementById('l'),k=null,m=location.hash.match(/k=([A-Za-z0-9]+)/);
  function get(n){try{return localStorage.getItem(n)}catch(e){return null}}
  function put(n,v){try{localStorage.setItem(n,v)}catch(e){}}
  if(m){k=m[1];put('kg78_key',k)}else k=get('kg78_key');
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
  if(!k){el.textContent='This device is not set up yet. Open your private Fitness Project link once on this device.';return}
  window.__KG78_REMOTE={api:API,key:k};
  var shown=false,cached=get('fp_app');
  function show(h){shown=true;document.open();document.write(h);document.close()}
  // cached copy opens instantly; a newer version is saved and used on the next launch
  if(cached&&cached.indexOf('<html')>-1)show(cached);
  fetch(API+'?action=app&k='+encodeURIComponent(k),{credentials:'omit'}).then(function(r){return r.text()}).then(function(h){
    if(h.indexOf('<html')<0)throw new Error(h.slice(0,80));
    if(h!==cached)put('fp_app',h);
    if(!shown)show(h);
  }).catch(function(e){if(!shown)el.textContent='Could not load the dashboard ('+e.message+'). Check your connection and reopen.'});
})();
</script></body></html>
